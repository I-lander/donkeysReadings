services:
  - type: web
    name: donkeys-readings-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server/index.ts
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FREE_READINGS_PER_DAY
        value: '3'
      - key: CREDITS_PER_AD
        value: '1'
      - key: DB_PATH
        value: /tmp/donkeys.db
      - key: GOOGLE_CLIENT_ID
        sync: false
